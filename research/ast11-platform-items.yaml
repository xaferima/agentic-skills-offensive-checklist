# ast11-platform-items.yaml — PLATFORM VECTORS (agent hosts + MCP)
# domain: agentic-skills-offensive-checklist · task A11 · generated 2026-10-14
# schema: harness/state.schema.md (Item schema + utility gate)
# Every item is an ATTACK test: attacker verb + tool + observable success. No mitigation-only entries.
# ETHICS: researcher-owned Docker/local labs and own hosts only. Never run against third parties.
#
# EXCLUDED (unverifiable in the fetched corpus — NOT fabricated into items):
#   - Cursor/Codex malicious manifest.json tool-config RCE on repo open: only referenced as the
#     "Primary Risk File" in OWASP AST10 (no technique/PoC in m10x Parts 2-4 or Check Point).
#   - VS Code package.json / extension.ts activationCommand RCE: same, no public technique verified.
#   - Pure SQL injection in non-prepared-statement MCP tools, MCP port scanning, local filename
#     enumeration: generic web/API techniques already covered by existing checklists (D low).
#   - OpenClaw-specific vectors: outside this corpus (see OWASP AST10 incident timeline).

