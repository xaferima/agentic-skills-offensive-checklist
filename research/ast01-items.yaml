# AST01 — Malicious Skills: offensive test items (lab-only)
# Each defensive check in checklist.md §AST01 (1.1–1.6) is inverted into a concrete
# attacker test: attacker verb + observable success. Mitigations are NOT restated here.
# ETHICS: researcher-owned Docker/local labs ONLY. PoCs use snyk-labs/toxicskills-goof
# or the researcher's own lab skills — never real-registry skills against third parties.
domain: agentic-skills-offensive-checklist
section: AST01-malicious-skills
risk_severity: Critical                   # per OWASP AST01
platforms_affected: All
generated: "2026-10-14"
lang: en
